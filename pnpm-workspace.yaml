packages:
  - "app/ui/*"
  - "website"
# Nothing is hoisted publicly. Electron Forge's pnpm check accepts a declared
# public-hoist-pattern (even an empty one) as proof that packaging under the
# isolated linker was configured on purpose.
publicHoistPattern: []
# Quarantine (Lupinum website standard): new versions wait 24 hours, and a
# version still inside the wait fails the install instead of being swapped.
# Our own @lupinum packages are released and checked by us, so they may be
# installed on the day they ship.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  - "@lupinum/*"
confirmModulesPurge: false
blockExoticSubdeps: false
overrides:
  # Keep Forge's legacy minimatch graph on its patched brace-expansion majors.
  "brace-expansion@1": 1.1.21
  "brace-expansion@2": 2.1.7
  "brace-expansion@5": 5.0.12
  fast-uri: 3.1.9
  ip-address: 10.7.6
  nanoid: 3.3.18
  tar: 7.5.21
  tmp: 0.2.7
  "undici@7": 7.30.1
  "undici@8": 8.12.2
  # Forge's Packager 18 still names the retired extractor. Electron's hardened
  # drop-in keeps that API while rejecting symlink escapes.
  extract-zip: "npm:@electron-internal/extract-zip@1.0.4"
  # Tooling advisories, 8 November 2026. Forge and @vue/test-utils keep older
  # glob and minimatch majors whose APIs the newer majors still export.
  "glob@>=9.0.0 <14.0.2": 14.0.4
  "minimatch@>=7.0.0 <11.0.1": 11.0.5
allowBuilds:
  electron: true
  esbuild: true
  fs-xattr: true
  macos-alias: true
  vue-demi: true
auditConfig:
  ignoreGhsas:
    # Electron Forge's DMG maker reaches image-size 0.7 through appdmg's
    # callback API. The affected ICNS parser never receives input: appdmg
    # measures the repository-owned PNG background and copies the ICNS icon
    # without parsing it.
    - GHSA-w3rx-r6r6-pgpr
    # Forge reaches http-cache-semantics only in build-time download clients.
    # The app does not ship it or expose a shared authenticated response cache.
    # No patch is published. Remove when a patched release becomes available,
    # or reassess before adding an authenticated shared-cache consumer.
    - GHSA-ch52-4w7c-c8xp
    # braces receives repository-owned build glob patterns through Forge and
    # Nuxt tooling. Player input never becomes a glob pattern.
    # No patch is published. Remove when a patched release becomes available,
    # or reassess before accepting untrusted glob patterns.
    - GHSA-vfj7-8cjw-p6xm
    # deepmerge reaches only Nitro's build-time @rollup/plugin-node-resolve,
    # which merges repository-owned resolver options. No patch is published.
    # Remove when a patched release becomes available.
    - GHSA-gcqx-w48m-w2h4
