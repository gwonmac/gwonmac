[toolchain]
channel = "1.88.0"
# rustup owns what a profile contains and can redefine it; these are the pieces
# this repository needs, named here so the pin does not depend on that
# definition: Cargo, which builds the kernel workspace in Cargo.toml, the
# compiler that enforces the lints kernels/companion/lib.rs denies, and the
# `core` that `targets` below installs for wasm32. Clippy and rustfmt are
# absent because no build step or gate runs them.
components = ["cargo", "rustc", "rust-std"]
targets = ["wasm32-unknown-unknown"]
profile = "minimal"
