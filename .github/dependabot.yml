# Security updates only for now. Version updates stay off
# (open-pull-requests-limit: 0); Dependabot security updates ignore that limit
# and arrive grouped per ecosystem. They need "Dependabot security updates"
# turned on in the repository settings.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
