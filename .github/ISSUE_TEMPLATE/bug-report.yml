name: Bug report
description: Report a crash, startup, download, gameplay, or performance problem.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. A short description is enough.

        GitHub issues are public. The diagnostics ZIP excludes credentials, account identifiers, packet contents, HTTP bodies, headers, cookies, filesystem paths, and crash dumps. Review it before you attach it.
  - type: input
    id: version
    attributes:
      label: App version
      description: "Choose Guild Wars Reforged → About Guild Wars Reforged in the menu bar."
      placeholder: "1.0.0"
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the problem in your own words. One or two sentences is fine.
      placeholder: The screen froze after I used a Wintersday alcohol item, then recovered a few minutes later.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce (optional)
      description: Leave this blank if you do not know how to reproduce it.
      placeholder: |
        1. …
        2. …
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics ZIP
      description: In a game window, choose Help → Diagnostics → Export Recent Diagnostics…, then drag the `.zip` here. Leave blank if you cannot export it.
      placeholder: Drag the .zip file here.
